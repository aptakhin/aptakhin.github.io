<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berlin muss besser mit Hitze, Wasser und Klimafolgen umgehen. - Berlin 2026 Party Program Comparison</title>
  <link rel="stylesheet" href="../styles.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="problemApp('climate-adaptation')" x-init="load()">
  <header>
    <div>
      <p class="eyebrow"><a :href="withLang('../index.html')">Berlin elections 2026</a></p>
      <h1>Berlin muss besser mit Hitze, Wasser und Klimafolgen umgehen.</h1>
    </div>
    <nav class="language-links" aria-label="Languages">
      <a :class="{active: language === ''}" :href="withLang('climate-adaptation.html', '')">DE</a>
      
        <a :class="{active: language === 'en'}" :href="withLang('climate-adaptation.html', 'en')">EN</a>
      
        <a :class="{active: language === 'tr'}" :href="withLang('climate-adaptation.html', 'tr')">TR</a>
      
        <a :class="{active: language === 'ar'}" :href="withLang('climate-adaptation.html', 'ar')">AR</a>
      
        <a :class="{active: language === 'uk'}" :href="withLang('climate-adaptation.html', 'uk')">UK</a>
      
        <a :class="{active: language === 'ru'}" :href="withLang('climate-adaptation.html', 'ru')">RU</a>
      
    </nav>
  </header>

  <main class="problem-page">
    <aside aria-label="Problems">
      <template x-for="item in site.problem_clusters" :key="item.id">
        <a :class="{active: item.id === clusterId}" :href="withLang(item.id + '.html')">
          <span x-text="item.problem_de"></span>
          <strong x-text="item.position_count"></strong>
        </a>
      </template>
    </aside>

    <section>
      <p class="muted">Reviewed cluster of party positions on the same political problem.</p>
      <div class="grid">
        <template x-for="position in problem.positions" :key="position.id">
          <article>
            <div class="party">
              <span class="dot" :style="partyStyle(position.party_id)"></span>
              <strong x-text="position.party_name"></strong>
            </div>
            <h2 x-text="position.heading"></h2>
            <p x-text="position.summary_de"></p>
            <details>
              <summary>Original German position</summary>
              <p class="body" x-text="position.text_de"></p>
            </details>
            <details x-show="language">
              <summary x-text="'Translation: ' + languageName()"></summary>
              <p class="body" x-text="position.translations[language] || 'Translation is not cached yet. Run scripts/build.sh --translate to fill it.'"></p>
            </details>
          </article>
        </template>
      </div>
    </section>
  </main>

  <script>
    function problemApp(clusterId) {
      return {
        clusterId,
        site: {problem_clusters: [], parties: [], languages: []},
        problem: {positions: []},
        language: '',
        async load() {
          this.language = new URLSearchParams(window.location.search).get('lang') || '';
          const [siteResponse, problemResponse] = await Promise.all([
            fetch('../data/site.json'),
            fetch(`../data/problems/${clusterId}.json`)
          ]);
          this.site = await siteResponse.json();
          this.problem = await problemResponse.json();
        },
        languageName() {
          const found = this.site.languages.find((lang) => lang.code === this.language);
          return found ? found.name : '';
        },
        withLang(href, code = this.language) {
          if (!code) return href;
          const separator = href.includes('?') ? '&' : '?';
          return `${href}${separator}lang=${encodeURIComponent(code)}`;
        },
        partyStyle(id) {
          const party = this.site.parties.find((item) => item.id === id);
          return `background:${party ? party.color : '#666'}`;
        }
      };
    }
  </script>
</body>
</html>
